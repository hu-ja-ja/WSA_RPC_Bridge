name: setup
description: mise toolchain + caches + JDK/Android toolchain

inputs:
  js:
    description: 'Install JS dependencies (pnpm cache + mise run deps)'
    default: 'true'
  rust:
    description: 'Enable Rust cache'
    default: 'false'
  android:
    description: 'Enable Gradle cache (JDK/SDK/NDK come from mise env + runner image)'
    default: 'false'

runs:
  using: composite
  steps:
    - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4

    - if: inputs.js == 'true'
      name: Get pnpm store path
      id: pnpm-cache
      shell: bash
      run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

    - if: inputs.js == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
        key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-pnpm-store-

    - if: inputs.js == 'true'
      shell: bash
      run: mise run deps

    - if: inputs.rust == 'true'
      uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      with:
        # Share one cache lineage across jobs. Per-job keys left android
        # restoring a stale partial registry, which forced cold mass
        # downloads that kept dying mid-fetch. env+lock hashes still differ
        # the key when toolchains or dependencies actually change.
        shared-key: wsa-rpc-bridge
        workspaces: src-tauri -> target

    - if: inputs.android == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('src-tauri/gen/android/**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-
