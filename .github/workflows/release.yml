name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> src-tauri/target

      - run: pnpm install

      - uses: cargo-bins/cargo-binstall@main
        with:
          version: 1.21.1
      - run: cargo binstall cargo-about --no-confirm --force
      - run: cargo about --version

      - name: Sync version from tag
        shell: pwsh
        run: |
          $version = "${{ github.event.release.tag_name }}" -replace '^v', ''

          $conf = Get-Content src-tauri/tauri.conf.json -Raw
          $conf = $conf -replace '(?m)"version":\s*"[^"]*"', "`"version`": `"$version`""
          Set-Content src-tauri/tauri.conf.json $conf -NoNewline -Encoding utf8

          $toml = Get-Content src-tauri/Cargo.toml -Raw
          $toml = $toml -replace '(?m)^version = ".*"', "version = `"$version`""
          Set-Content src-tauri/Cargo.toml $toml -NoNewline -Encoding utf8

          Write-Output "synced version $version"

      - run: pnpm tauri build --bundles msi
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Generate SHA-256 checksums
        shell: pwsh
        run: |
          $msiFiles = Get-ChildItem -Path src-tauri/target/release/bundle/msi/*.msi
          foreach ($msi in $msiFiles) {
            $hash = (Get-FileHash -Path $msi.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($msi.Name)" | Out-File -FilePath "$($msi.FullName).sha256" -Encoding ascii
          }

      - name: Generate update.json
        shell: pwsh
        run: |
          $version = "${{ github.event.release.tag_name }}" -replace '^v', ''
          $msi = Get-ChildItem src-tauri/target/release/bundle/msi/*.msi | Select-Object -First 1
          $sigPath = "$($msi.FullName).sig"
          $sig = ""
          if (Test-Path $sigPath) {
            $sig = (Get-Content $sigPath -Raw).Trim()
          }
          $url = "https://github.com/${{ github.repository }}/releases/download/${{ github.event.release.tag_name }}/$($msi.Name)"
          $pubDate = (Get-Date -Format "yyyy-MM-ddTHH:mm:ssZ")

          $json = @{
            version = $version
            notes   = "${{ github.event.release.body }}"
            pub_date = $pubDate
            platforms = @{
              "windows-x86_64" = @{
                signature = $sig
                url       = $url
              }
            }
          }
          $json | ConvertTo-Json -Depth 10 | Set-Content update.json -Encoding utf8
          Write-Output "update.json generated for version $version"

      - name: Deploy update.json to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          keep_files: false
          destination_dir: .

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/msi/*.msi.sig
            src-tauri/target/release/bundle/msi/*.msi.sha256
