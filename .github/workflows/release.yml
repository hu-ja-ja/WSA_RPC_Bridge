name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'アプリのバージョン（例: 0.4.0）'
        required: true
        type: string
      channel:
        description: 'リリースチャネル'
        required: false
        default: release
        type: choice
        options:
          - release
          - beta

permissions:
  contents: write

env:
  MISE_TASK_OUTPUT: prefix

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup
        with:
          rust: 'true'
          android: 'true'

      - name: Sync version from input
        run: mise run pipeline:sync-version "${{ inputs.version }}"

      - name: Setup Android SDK + NDK
        uses: android-actions/setup-android@v4
        with:
          packages: tools platform-tools ndk;${{ env.NDK_VERSION }}

      - name: Download Social SDK
        env:
          SDK_URL: ${{ secrets.SDK_URL }}
        run: mise run pipeline:download-sdk

      - name: Decode Android signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: mise run pipeline:keystore

      - name: Generate licenses
        run: mise run generate-licenses

      - name: Generate Android codegen and verifier dependency
        run: mise run pipeline:codegen

      - name: Build Android APK (aarch64)
        run: pnpm tauri android build --apk --target aarch64

      - name: Stop Gradle daemon
        if: always()
        working-directory: src-tauri/gen/android
        run: ./gradlew --stop

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: src-tauri/gen/android/app/build/outputs/apk/universal/release/*.apk
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup
        with:
          rust: 'true'

      - name: Sync version from input
        run: mise run pipeline:sync-version "${{ inputs.version }}"

      - name: Generate licenses
        run: mise run generate-licenses

      - name: Build Windows MSI
        run: pnpm tauri build --bundles msi
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Upload MSI
        uses: actions/upload-artifact@v4
        with:
          name: msi
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/msi/*.msi.sig
          if-no-files-found: error

  release:
    needs: [build-android, build-windows]
    runs-on: ubuntu-latest
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: apk
          path: src-tauri/gen/android/app/build/outputs/apk/universal/release/

      - name: Download MSI
        uses: actions/download-artifact@v4
        with:
          name: msi
          path: src-tauri/target/release/bundle/msi/

      - name: Decode Android signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: mise run pipeline:keystore

      - name: Generate SHA-256 checksums
        run: mise run pipeline:checksums

      - name: Extract release notes from CHANGELOG.md
        run: mise run pipeline:notes "${{ inputs.version }}"

      - name: Generate update.json
        run: mise run pipeline:update-json "${{ inputs.version }}"

      - name: Publish update.json to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ${{ runner.temp }}/pages
          keep_files: true
          destination_dir: .

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          body_path: .release-notes.md
          prerelease: ${{ inputs.channel == 'beta' }}
          make_latest: ${{ inputs.channel != 'beta' }}
          files: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/msi/*.msi.sig
            src-tauri/target/release/bundle/msi/*.msi.sha256
            src-tauri/gen/android/app/build/outputs/apk/universal/release/*.apk
            ${{ runner.temp }}/apk-signing-fingerprint.txt
