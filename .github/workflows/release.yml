name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'アプリのバージョン（例: 0.4.0）'
        required: true
        type: string
      sdk_url:
        description: 'Discord Social SDK の期限付きダウンロードURL'
        required: true
        type: string

permissions:
  contents: write

env:
  MISE_TASK_OUTPUT: prefix

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v3

      - name: Mask SDK URL
        shell: pwsh
        run: echo "::add-mask::${{ inputs.sdk_url }}"

      - name: Get pnpm store path
        id: pnpm-cache
        shell: pwsh
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $env:GITHUB_OUTPUT
      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> src-tauri/target

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~\.gradle\caches
            ~\.gradle\wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('src-tauri/gen/android/**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - run: mise run deps

      - name: Sync version from input
        shell: pwsh
        run: |
          $version = "${{ inputs.version }}"

          $conf = Get-Content src-tauri/tauri.conf.json -Raw
          $conf = $conf -replace '(?m)"version":\s*"[^"]*"', "`"version`": `"$version`""
          Set-Content src-tauri/tauri.conf.json $conf -NoNewline -Encoding utf8

          $toml = Get-Content src-tauri/Cargo.toml -Raw
          $toml = $toml -replace '(?m)^version = ".*"', "version = `"$version`""
          Set-Content src-tauri/Cargo.toml $toml -NoNewline -Encoding utf8

          Write-Output "synced version $version"

      - name: Set JAVA_HOME
        shell: pwsh
        run: echo "JAVA_HOME=$(mise where java)" >> $env:GITHUB_ENV

      - name: Install Android NDK
        shell: pwsh
        run: |
          $sdk = "$env:ANDROID_HOME\cmdline-tools\latest\bin\sdkmanager.bat"
          1..50 | ForEach-Object { 'y' } | & $sdk --licenses
          & $sdk "ndk;$env:NDK_VERSION"

      - name: Download Social SDK
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "${{ inputs.sdk_url }}" -OutFile "src-tauri/gen/android/app/libs/discord_partner_sdk.aar"

      - name: Decode Android signing keystore
        shell: pwsh
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if ($env:ANDROID_KEYSTORE_BASE64 -eq "") {
            Write-Warning "ANDROID_KEYSTORE_BASE64 is not set; release APK will be unsigned"
            exit 0
          }
          $keystore = "$env:RUNNER_TEMP\release.keystore"
          [IO.File]::WriteAllBytes($keystore, [Convert]::FromBase64String($env:ANDROID_KEYSTORE_BASE64))
          "KEYSTORE_FILE=$keystore" >> $env:GITHUB_ENV
          "KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> $env:GITHUB_ENV
          "KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}" >> $env:GITHUB_ENV
          "KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}" >> $env:GITHUB_ENV
          Write-Output "keystore restored to $keystore"

      - name: Build Android APK (aarch64)
        run: pnpm tauri android build --apk --target aarch64

      - name: Build Windows MSI
        run: pnpm tauri build --bundles msi
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Generate SHA-256 checksums
        shell: pwsh
        run: |
          $msiFiles = Get-ChildItem -Path src-tauri/target/release/bundle/msi/*.msi
          foreach ($msi in $msiFiles) {
            $hash = (Get-FileHash -Path $msi.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($msi.Name)" | Out-File -FilePath "$($msi.FullName).sha256" -Encoding ascii
          }

      - name: Generate APK signing fingerprint
        shell: pwsh
        run: |
          $apk = Get-ChildItem src-tauri/gen/android/app/build/outputs/apk/arm64/release/*.apk | Select-Object -First 1
          if (-not $apk) { Write-Warning "no release APK found"; exit 0 }
          $keystore = "$env:RUNNER_TEMP\release.keystore"
          if (-not (Test-Path $keystore)) { Write-Warning "no keystore; skipping fingerprint"; exit 0 }
          $fp = & keytool -list -v -keystore $keystore -alias $env:KEY_ALIAS -storepass $env:KEYSTORE_PASSWORD 2>$null |
            Select-String -Pattern 'SHA256:' | Select-Object -First 1
          if ($fp) {
            $line = $fp.ToString().Trim()
            $fpValue = ($line -replace '^.*SHA256:\s*', '').Replace(':', '').Trim()
            "Signing certificate SHA-256 fingerprint`n$fpValue" | Out-File apk-signing-fingerprint.txt -Encoding ascii
            Write-Output "fingerprint: $fpValue"
          } else {
            Write-Warning "keytool fingerprint extraction failed"
          }

      - name: Extract release notes from CHANGELOG.md
        id: changelog
        shell: pwsh
        run: |
          $version = "${{ inputs.version }}"
          $content = Get-Content CHANGELOG.md -Raw
          $pattern = "(?ms)^## \[\s*$([regex]::Escape($version))\s*\][^\r\n]*\r?\n(.*?)(?=^## \[\s*|\z)"
          $m = [regex]::Match($content, $pattern)
          if ($m.Success) {
            $body = $m.Groups[1].Value.Trim()
            Set-Content .release-notes.md $body -Encoding utf8
            Write-Output "has_section=true" >> $env:GITHUB_OUTPUT
          } else {
            Write-Output "has_section=false" >> $env:GITHUB_OUTPUT
          }

      - name: Generate update.json
        shell: pwsh
        run: |
          $version = "${{ inputs.version }}"
          $msi = Get-ChildItem src-tauri/target/release/bundle/msi/*.msi | Select-Object -First 1
          $sigPath = "$($msi.FullName).sig"
          $sig = ""
          if (Test-Path $sigPath) {
            $sig = (Get-Content $sigPath -Raw).Trim()
          }
          $notes = ""
          if (Test-Path .release-notes.md) {
            $notes = Get-Content .release-notes.md -Raw
          }
          $url = "https://github.com/${{ github.repository }}/releases/download/v$version/$($msi.Name)"
          $pubDate = (Get-Date -Format "yyyy-MM-ddTHH:mm:ssZ")

          $json = @{
            version = $version
            notes   = $notes
            pub_date = $pubDate
            platforms = @{
              "windows-x86_64" = @{
                signature = $sig
                url       = $url
              }
            }
          }
          $json | ConvertTo-Json -Depth 10 | Set-Content update.json -Encoding utf8
          Write-Output "update.json generated for version $version"

      - name: Deploy update.json to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          keep_files: false
          destination_dir: .

      - name: Create release
        if: steps.changelog.outputs.has_section == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          body_path: .release-notes.md
          files: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/msi/*.msi.sig
            src-tauri/target/release/bundle/msi/*.msi.sha256
            src-tauri/gen/android/app/build/outputs/apk/arm64/release/*.apk
            apk-signing-fingerprint.txt

      - name: Create release (fallback)
        if: steps.changelog.outputs.has_section != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          generate_release_notes: true
          files: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/msi/*.msi.sig
            src-tauri/target/release/bundle/msi/*.msi.sha256
            src-tauri/gen/android/app/build/outputs/apk/arm64/release/*.apk
            apk-signing-fingerprint.txt