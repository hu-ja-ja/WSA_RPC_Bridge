name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  MISE_TASK_OUTPUT: prefix

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup
        with:
          rust: 'true'

      - run: mise run generate-licenses

      # type-aware lint resolves every tsconfig, including site/ (astro extends).
      # Site deps are not part of the root install, so install them here.
      - run: mise run docs-deps

      - run: mise run lint

      - run: pnpm tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - run: mise run test

  android-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup
        with:
          rust: 'true'
          android: 'true'

      - name: Diagnose cargo env (temporary)
        shell: pwsh
        run: |
          cargo --version
          Get-PSDrive C | Select-Object Used, Free
          cargo metadata --format-version 1 --manifest-path src-tauri/Cargo.toml > $null

      - run: mise run pipeline:codegen

      - run: mise run android-test

      - name: Stop Gradle daemon
        shell: pwsh
        working-directory: src-tauri/gen/android
        run: ./gradlew.bat --stop
