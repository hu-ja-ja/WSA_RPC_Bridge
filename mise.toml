[tools]
"github:Infisical/cli" = "0.43.121"
node = "22"
pnpm = "11.15.1"
java = "21"
rust = { version = "1.97", components = ["rust-analyzer"], targets = ["aarch64-linux-android", "armv7-linux-androideabi", "i686-linux-android", "x86_64-linux-android"] }
"github:StrawberryPerl/Perl-Dist-Strawberry" = { version = "SP_54231_64bit", matching = "portable", bin_path = "perl/bin", os = ["windows"] }
"aqua:skaji/relocatable-perl" = { version = "latest", os = ["linux", "macos"] }
"github:EmbarkStudios/cargo-about" = "0.9.1"

[tasks.dev]
description = "Tauri + Vite dev server"
run = "infisical run -- pnpm tauri dev"

[tasks.build]
description = "Build release bundle"
run = "infisical run -- pnpm generate-licenses && infisical run -- pnpm tauri build"

[tasks.lint]
description = "Run oxlint"
run = "pnpm lint"

[tasks.test]
description = "Run cargo unit tests"
dir = "src-tauri"
run = "cargo test"

[tasks.android-test]
description = "Run Android unit tests (Robolectric). Requires `mise run pipeline:codegen` on a fresh checkout"
dir = "src-tauri/gen/android"
run = "./gradlew test"
run_windows = "gradlew.bat test"

[tasks.tauri]
description = "Pass-through to the tauri CLI"
run = "infisical run -- pnpm tauri"

[tasks.deps]
description = "Install JS dependencies"
run = "pnpm install"

[tasks.generate-licenses]
description = "Regenerate third-party licenses"
sources = ["package.json", "pnpm-lock.yaml", "src-tauri/Cargo.toml", "src-tauri/Cargo.lock", "src-tauri/about.toml", "scripts/generate-licenses.ts"]
outputs = ["src/generated/licenses.ts"]
run = "pnpm generate-licenses"

[tasks."pipeline:codegen"]
description = "Generate Android codegen files ignored by git (gradle settings + kotlin templates)"
sources = ["src-tauri/Cargo.toml", "src-tauri/Cargo.lock", "src-tauri/tauri.conf.json", "src-tauri/build.rs"]
# NB: app/libs/*.aar is also generated here but excluded: cpSync preserves the
# registry mtime (years old), which would defeat the newer-than-sources check
# forever. The aar version is derived from Cargo.lock (a source), so dep
# updates still trigger a rerun.
outputs = ["src-tauri/gen/android/tauri.settings.gradle", "src-tauri/gen/android/app/tauri.build.gradle.kts", "src-tauri/gen/android/app/src/main/java/**/generated/*"]
run = "node scripts/pipeline.ts android-codegen"

[tasks."pipeline:sync-version"]
description = "Sync release version into tauri.conf.json and Cargo.toml"
usage = 'arg "<version>" help="Release version like 0.4.0 (a leading v is stripped)"'
run = "node scripts/pipeline.ts sync-version \"{{usage.version}}\""

[tasks."pipeline:download-sdk"]
description = "Download and validate the Social SDK aar (needs SDK_URL)"
run = "node scripts/pipeline.ts download-sdk"

[tasks."pipeline:keystore"]
description = "Restore the Android signing keystore from secrets"
run = "node scripts/pipeline.ts keystore"

[tasks."pipeline:notes"]
description = "Extract release notes for a version from CHANGELOG.md"
usage = 'arg "<version>" help="Release version like 0.4.0 (a leading v is stripped)"'
run = "node scripts/pipeline.ts release-notes \"{{usage.version}}\""

[tasks."pipeline:update-json"]
description = "Generate update.json + update-android.json (and rename the APK) for a version"
usage = 'arg "<version>" help="Release version like 0.4.0 (a leading v is stripped)"'
run = "node scripts/pipeline.ts update-json \"{{usage.version}}\""

[tasks."pipeline:checksums"]
description = "Generate MSI sha256 files and the APK signing fingerprint"
sources = ["src-tauri/target/release/bundle/msi/*.msi", "src-tauri/gen/android/app/build/outputs/apk/universal/release/*.apk"]
outputs = ["src-tauri/target/release/bundle/msi/*.msi.sha256"]
run = "node scripts/pipeline.ts checksums"

[tasks."pipeline:test"]
description = "Run pipeline.ts unit tests"
sources = ["scripts/pipeline.ts", "scripts/pipeline.test.ts"]
run = "node --test scripts/pipeline.test.ts"

[tasks.docs-deps]
description = "Install docs site dependencies"
dir = "site"
run = "pnpm install --frozen-lockfile"

[tasks.docs-dev]
description = "Run the Astro Starlight docs dev server on port 4321"
dir = "site"
run = "pnpm dev"

[tasks.docs-build]
description = "Build the Astro Starlight docs site for GitHub Pages /docs (BASE_PATH overridable)"
dir = "site"
sources = ["src/**/*", "public/**/*", "scripts/**/*", "astro.config.mjs", "package.json", "pnpm-lock.yaml", "tsconfig.json"]
outputs = ["dist"]
env = { BASE_PATH = "{{ get_env(name='BASE_PATH', default='/WSA_RPC_Bridge/docs/') }}" }
run = "pnpm build"

[env]
NDK_VERSION = "29.0.14206865"
SDK_ROOT = '{% if get_env(name="CI", default="") == "true" %}{{ get_env(name="ANDROID_HOME") }}{% elif os() == "windows" %}{{ env.LOCALAPPDATA }}\Android\Sdk{% elif get_env(name="ANDROID_HOME", default="") != "" %}{{ get_env(name="ANDROID_HOME") }}{% else %}{{ env.HOME }}/Android/Sdk{% endif %}'
ANDROID_HOME = '{{ env.SDK_ROOT }}'
NDK_BIN = '{{ env.SDK_ROOT }}/ndk/{{ env.NDK_VERSION }}/toolchains/llvm/prebuilt/{% if os() == "windows" %}windows-x86_64{% else %}linux-x86_64{% endif %}/bin'
CLANG_EXT = '{% if os() == "windows" %}.cmd{% endif %}'
AR_EXT = '{% if os() == "windows" %}.exe{% endif %}'

CC_aarch64_linux_android = "{{ env.NDK_BIN }}/aarch64-linux-android24-clang{{ env.CLANG_EXT }}"
AR_aarch64_linux_android = "{{ env.NDK_BIN }}/llvm-ar{{ env.AR_EXT }}"
CC_armv7_linux_androideabi = "{{ env.NDK_BIN }}/armv7a-linux-androideabi24-clang{{ env.CLANG_EXT }}"
AR_armv7_linux_androideabi = "{{ env.NDK_BIN }}/llvm-ar{{ env.AR_EXT }}"
CC_i686_linux_android = "{{ env.NDK_BIN }}/i686-linux-android24-clang{{ env.CLANG_EXT }}"
AR_i686_linux_android = "{{ env.NDK_BIN }}/llvm-ar{{ env.AR_EXT }}"
CC_x86_64_linux_android = "{{ env.NDK_BIN }}/x86_64-linux-android24-clang{{ env.CLANG_EXT }}"
AR_x86_64_linux_android = "{{ env.NDK_BIN }}/llvm-ar{{ env.AR_EXT }}"